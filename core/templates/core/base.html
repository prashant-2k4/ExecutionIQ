{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ExecutionIQ{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'goal_list' %}" class="logo">ExecutionIQ</a>
        <div class="nav-links">
            <a href="{% url 'goal_list' %}">Goals</a>
            <a href="{% url 'ai_plan' %}">AI Planner</a>
        </div>
    </nav>

    <main class="container">

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}

    </main>

</body>
</html>
