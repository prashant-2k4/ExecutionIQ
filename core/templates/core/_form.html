<form method="post" class="form-card">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="alert alert-error">{{ form.non_field_errors }}</div>
    {% endif %}

    <div class="form-grid">
        {% for field in form %}
            <div class="form-field{% if field.errors %} has-error{% endif %}{% if field.name == 'description' or field.name == 'title' or field.name == 'notes' %} form-field-wide{% endif %}">
                {{ field.label_tag }}
                {{ field }}
                {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
                {{ field.errors }}
            </div>
        {% endfor %}
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
        <a href="{% url 'goal_list' %}" class="btn btn-ghost">Cancel</a>
    </div>
</form>
